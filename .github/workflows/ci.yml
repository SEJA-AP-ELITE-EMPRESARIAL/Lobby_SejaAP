name: CI

# Roda em todo push e em todo PR para a main. A main é o que a produção puxa,
# e este repo passou de Django 5.0.9 a 6.1 sem nenhuma rede automatizada: até
# aqui a suíte só rodava quando alguém lembrava de rodá-la na própria máquina.
#
# Escopo é CI. O deploy do Lobby é manual (`docker compose --build` na .164,
# ver deploy/RUNBOOK.md) e continua sendo — o portão é este, não a publicação.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # ATENÇÃO — não remova estas quatro linhas.
      #
      # O settings lê `.env` na raiz do backend e monta o banco por cascata
      # (DATABASE_URL > LOBBY_DB_* > SQLite). Numa máquina de desenvolvimento
      # esse `.env` aponta para o Postgres de PRODUÇÃO, e `manage.py test` cria
      # e derruba um `test_<nome>` onde estiver apontado. Zerar as convenções
      # da casa força a cascata a cair no SQLite.
      #
      # No runner o `.env` nem existe (é gitignorado), mas as variáveis ficam
      # aqui de propósito: quem copiar este arquivo para rodar em outro lugar
      # leva a proteção junto. `load_dotenv` não sobrescreve variável que já
      # está no ambiente — é justamente por isso que zerar funciona.
      DB_NAME: ""
      LOBBY_DB_NAME: ""
      DATABASE_URL: ""
      CRM_DB_ENGINE: ""
      DJANGO_SECRET_KEY: ci-nao-e-segredo-de-producao
      # O Redis do passo "Redis de teste", com a mesma configuração do de
      # produção (TSK-1068). A suíte o ESVAZIA (`cache.clear()` é FLUSHDB):
      # nunca aponte isto para um Redis que guarde alguma coisa.
      LOBBY_REDIS_URL: redis://:ci-nao-e-segredo-de-producao@127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Mesma série da imagem de produção — ver backend/Dockerfile
          # (`FROM python:3.14-slim`). Se as duas divergirem, o CI passa a
          # atestar um Python que produção não roda, que é pior que CI nenhum.
          # Manter as duas juntas em qualquer upgrade.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Redis de teste
        # Com ele a suíte roda contra um Redis de verdade, com senha — é o único
        # jeito de provar que o `jti` repetido é recusado ENTRE PROCESSOS
        # (`JtiEntreProcessosTest`), e não só dentro do mesmo worker. Sem ele
        # aquele teste é pulado, e pulado reprova no passo "Testes".
        #
        # `docker run`, e não um `services:`: serviço do Actions não aceita
        # comando, e sem comando não há `requirepass`. Os parâmetros são os do
        # serviço `redis` do docker-compose.yml.
        run: |
          docker run -d --name redis -p 127.0.0.1:6379:6379 redis:7-alpine \
            redis-server --requirepass ci-nao-e-segredo-de-producao \
            --save '' --appendonly no --maxmemory 64mb --maxmemory-policy noeviction
          for _ in $(seq 1 30); do
            if docker exec -e REDISCLI_AUTH=ci-nao-e-segredo-de-producao redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::O Redis de teste não respondeu em 30 s."
          docker logs redis
          exit 1

      - name: Provar que o banco do CI é descartável
        # Contraprova do bloco `env` acima: se um dia alguém apagar uma daquelas
        # linhas, o job para AQUI, antes de qualquer teste tocar em banco.
        run: |
          python - <<'PY'
          import os, django

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          django.setup()
          from django.conf import settings

          motor = settings.DATABASES["default"]["ENGINE"]
          if not motor.endswith("sqlite3"):
              raise SystemExit(f"CI apontado para {motor}, não para SQLite — abortado")
          print("banco do CI:", motor)
          PY

      - name: Checagem do Django
        run: python manage.py check

      - name: Migrations em dia com os models
        # Model alterado sem migration passa despercebido até o deploy falhar
        # no start do backend, que é quando as migrations rodam.
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        shell: bash
        run: |
          python manage.py test --verbosity=2 2>&1 | tee "$RUNNER_TEMP/testes.log"

          # Teste pulado não é teste passado: no conecta-kanban 18 testes
          # ficaram atrás de um `skipUnless` e passaram por verdes em cinco
          # execuções seguidas. Aqui, pulou, reprova — e o log diz qual.
          if grep -qE "skipped=[0-9]+" "$RUNNER_TEMP/testes.log"; then
            echo "::error::A suíte terminou com testes pulados. Pulado não é passado."
            grep -E "\.\.\. skipped" "$RUNNER_TEMP/testes.log" || true
            exit 1
          fi

  front:
    name: Front — datas do cronograma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # O do PC e o da VPS de desenvolvimento.
          node-version: "24"

      - name: Datas do cronograma (index.html)
        # As datas vão com a venda para o n8n e o Omie, e o servidor confere só
        # os valores (TSK-1077). O teste roda as funções do próprio index.html,
        # sem navegador e sem dependência.
        # Dois fusos, porque é no Date local que a conta é feita.
        run: |
          node --version
          TZ=America/Sao_Paulo node --test tests/front/cronograma.test.mjs
          TZ=UTC node --test tests/front/cronograma.test.mjs

      - name: Erros do navegador no GlitchTip, sem dado pessoal
        # TSK-1142: o SDK versionado é o oficial (sha256), os HTMLs o carregam
        # antes do React, a limpeza do evento mascara CNPJ, senha e Authorization,
        # sem DSN nada liga e o config.js da subida não vira injeção de script.
        # Roda o SDK de verdade numa VM do Node, sem rede.
        run: node --test tests/front/glitchtip.test.mjs

      - name: Login central em manutenção (index, esqueci e definir senha)
        # TSK-1238: o 503 `erro: manutencao` vira o aviso "Temporariamente
        # indisponível / Em manutenção", com a previsão no horário de Brasília.
        # Dois fusos, porque o texto da previsão sai do Date.
        run: |
          TZ=America/Sao_Paulo node --test tests/front/manutencao.test.mjs
          TZ=UTC node --test tests/front/manutencao.test.mjs

      - name: Sessão do Lobby (login, 401, sair com comprovante pendente, enviado_por)
        # TSK-1513: o Lobby pede a conta do Conecta. Roda os trechos de JS puro do
        # index.html com fetch e sessionStorage de mentira: o 401 volta ao login
        # com o motivo, o comprovante leva a sessão e o X-Lobby-Autorizacao, o
        # 401 dele para a venda, sair com o comprovante a caminho não manda nada
        # ao n8n, e o payload ganha o enviado_por sem perder campo.
        run: node --test tests/front/sessao.test.mjs

      - name: Sinal de presença da tela (um por minuto, troca de tela, nada sem login)
        # TSK-1520: o painel "Uso em tempo real" do Conecta. Roda o trecho de JS
        # puro do index.html com relógio, fetch e document de mentira: um sinal
        # por minuto, um na troca de tela (o redirecionamento manda um só), um
        # na volta à aba; nada sem login; o erro engolido (o 401 não derruba a
        # sessão); e a última interação de verdade.
        run: node --test tests/front/presenca.test.mjs

      - name: Casais de Alta Performance (valor, o que falta, payload do n8n)
        # TSK-1622: roda o trecho de JS puro do index.html. O valor é um de dois
        # fixos — na PJ só o Conecta dizendo "ativo" para o CNPJ dá o do Elite,
        # na PF é o consultor —; cada etapa diz o que falta (e-mail, telefone,
        # os dois participantes, o mesmo CPF nos dois); o payload do n8n sai
        # chave a chave como o README documenta; o número do contrato é o
        # protocolo CAP-AAMMDDPRRRRR. Dois fusos, porque o protocolo sai do Date.
        run: |
          TZ=America/Sao_Paulo node --test tests/front/casais.test.mjs
          TZ=UTC node --test tests/front/casais.test.mjs
