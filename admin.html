<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap');

/* Tokens do design system Conecta AP — iguais aos do index.html. */
:root{
  --primary:#C7A444; --primary-light:#E8B84B; --primary-dark:#9C7C21;
  --primary-subtle:rgba(199,164,68,0.08);
  --background:#141412; --surface:#1E1E1C; --surface-light:#282826; --surface-elevated:#323230;
  --text:#F0F0F0; --text-secondary:#D0D0D0; --text-muted:#A0A0A0;
  --border-light:rgba(255,255,255,0.1);
  --success:#28A745; --warning:#FFC107; --danger:#DC3545;
  --gradient-primary:linear-gradient(135deg,#C7A444 0%,#9C7C21 100%);
  --font-primary:'Montserrat','Segoe UI',Tahoma,sans-serif;
  --font-secondary:'Roboto','Segoe UI',Tahoma,sans-serif;
  --focus-ring:0 0 0 3px rgba(199,164,68,0.32);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--background);color:var(--text);font-family:var(--font-secondary);-webkit-font-smoothing:antialiased;}
input,button,select,textarea{font-family:'Roboto',sans-serif;}
button{font-family:var(--font-primary);}
@keyframes slideUpFade{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.ms-icon{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;}
.ms-icon.rot{animation:spin .9s linear infinite;}
.inp{width:100%;height:44px;padding:0 12px;border-radius:8px;background:var(--surface-elevated);border:1px solid var(--border-light);color:var(--text);font:400 14px 'Roboto';outline:none;transition:border-color .15s,box-shadow .15s;}
.inp:focus{border-color:var(--primary);box-shadow:var(--focus-ring);}
.inp.mudou{border-color:var(--warning);}
.inp.sm{height:38px;font-size:13px;}
.lbl{display:block;font:500 12px var(--font-primary);color:var(--text-secondary);margin-bottom:6px;}
.lbl .dica{font:400 11px var(--font-secondary);color:var(--text-muted);margin-left:6px;}
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:14px;padding:22px;animation:slideUpFade .4s both;}
.btn-prim{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 28px;border-radius:10px;border:none;cursor:pointer;background:var(--gradient-primary);color:#1A1A18;font:700 14px var(--font-primary);letter-spacing:.03em;box-shadow:0 4px 14px rgba(199,164,68,.3);transition:transform .2s,box-shadow .2s,opacity .2s;}
.btn-prim:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(199,164,68,.4);}
.btn-prim:disabled{background:var(--surface-light);color:var(--text-muted);cursor:not-allowed;opacity:.6;box-shadow:none;}
.btn-prim.sm{height:38px;padding:0 18px;font-size:13px;}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;height:46px;padding:0 20px;border-radius:10px;border:1px solid var(--border-light);background:transparent;color:var(--text-secondary);font:600 13.5px var(--font-primary);cursor:pointer;transition:border-color .2s,color .2s;}
.btn-ghost:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}
.btn-ghost:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost.sm{height:38px;padding:0 14px;font-size:12.5px;}
.btn-perigo{color:#F1969E;border-color:rgba(220,53,69,.35);}
.btn-perigo:hover:not(:disabled){border-color:var(--danger);color:#F1969E;}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11.5px var(--font-primary);color:var(--primary);background:var(--primary-subtle);border:1px solid rgba(199,164,68,.35);padding:4px 10px;border-radius:7px;}
.chip.neutro{color:var(--text-muted);background:var(--surface-light);border-color:var(--border-light);}
.prod{display:grid;grid-template-columns:1fr 200px 200px;gap:16px;align-items:end;padding:16px 0;border-bottom:1px solid var(--border-light);}
.prod:last-child{border-bottom:none;}
.aviso{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:10px;font:400 13.5px var(--font-secondary);line-height:1.5;}
.sec-title{font:600 12px var(--font-primary);letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);}
/* Abas */
.abas{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border-light);margin-bottom:22px;}
.aba{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 16px;border:none;background:transparent;color:var(--text-muted);font:600 13px var(--font-primary);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.aba:hover{color:var(--text-secondary);}
.aba.on{color:var(--primary);border-bottom-color:var(--primary);}
/* Linha do tempo */
.tl{display:grid;grid-template-columns:150px 1fr 140px 190px;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.05);font:400 13px var(--font-secondary);}
.tl.cab{font:600 10.5px var(--font-primary);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border-light);}
.linha{display:grid;grid-template-columns:1fr 120px 150px 130px 96px;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.05);}
.linha.cab{font:600 10.5px var(--font-primary);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border-light);padding-bottom:8px;}
*::-webkit-scrollbar{width:10px;}
*::-webkit-scrollbar-thumb{background:var(--surface-light);border-radius:10px;border:2px solid var(--background);}
@media (max-width:900px){
  .prod{grid-template-columns:1fr;gap:10px;}
  .tl,.linha{grid-template-columns:1fr;gap:6px;}
  .tl.cab,.linha.cab{display:none;}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ============================================================================
 * Esta tela é o OUTRO mecanismo de credencial do Lobby, e a diferença importa.
 *
 * No lobby (index.html) a credencial autoriza UMA negociação e morre com ela —
 * não há sessão, porque quem digita é o gerente no aparelho do consultor.
 *
 * Aqui é sessão de verdade: configurar o catálogo é trabalho continuado, feito
 * no próprio computador de quem faz. O token fica no sessionStorage e some ao
 * fechar a aba.
 *
 * Tudo aqui exige papel de DIRETORIA. Gerente entra no lobby e autoriza
 * negociação — alcance de uma venda; o que se configura aqui vale para todas as
 * próximas.
 *
 * O QUE MUDOU EM 17/08/2026
 *
 * A tela era só preço: um número por produto. Passou a ter quatro abas, e a
 * razão é a mesma nas três novas — o caminho de menor esforço para mexer no
 * catálogo era o /django-admin/, que não deixa rastro nenhum:
 *
 *   Valores   — a tela de sempre (mensalidade / valor à vista).
 *   Cobrança  — o dia do vencimento e a regra da 1ª parcela, que até então eram
 *               constantes no index.html: mudar a data era deploy do front.
 *   Produtos  — criar e editar produto, com histórico.
 *   Histórico — a linha do tempo: o que valeu, quando, por decisão de quem.
 * ========================================================================== */
const CHAVE_TOKEN = 'lobby_sessao_diretoria';
const fmt = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dataHora = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';

const sessao = {
  ler() {
    try {
      const raw = JSON.parse(sessionStorage.getItem(CHAVE_TOKEN) || 'null');
      if (raw?.token && raw.exp * 1000 > Date.now()) return raw;
      sessionStorage.removeItem(CHAVE_TOKEN);
    } catch {}
    return null;
  },
  gravar(dados) { try { sessionStorage.setItem(CHAVE_TOKEN, JSON.stringify(dados)); } catch {} },
  limpar() { try { sessionStorage.removeItem(CHAVE_TOKEN); } catch {} },
};

/* Toda chamada autenticada passa por aqui: um lugar só para tratar o 401, que
   significa sessão expirada e derruba a tela em vez de mostrar erro genérico. */
function criaApi(token, aoExpirar) {
  return async function api(caminho, opcoes = {}) {
    let r;
    try {
      r = await fetch(caminho, {
        ...opcoes,
        cache: 'no-store',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(opcoes.headers || {}),
        },
      });
    } catch {
      throw new Error('Sem conexão. Verifique a internet e tente de novo.');
    }
    if (r.status === 401) { sessao.limpar(); aoExpirar(); throw new Error('Sessão expirada.'); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.erro || 'Não foi possível concluir a operação.');
    return d;
  };
}

/* Formatação e leitura de dinheiro — as MESMAS do `index.html`, de propósito.
   Duas telas que aceitam preço não podem discordar sobre o que "13.500" significa. */
const fmtMoneyPlain = (n) => Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function parseMoney(v) {
  if (typeof v === 'number') return v;
  let s = String(v == null ? '' : v).trim().replace(/[^\d.,-]/g, '');
  if (!s) return NaN;
  const hasComma = s.indexOf(',') > -1, hasDot = s.indexOf('.') > -1;
  if (hasComma && hasDot) s = s.replace(/\./g, '').replace(',', '.');
  else if (hasComma) s = s.replace(',', '.');
  return Number(s);
}

/* Entrada de dinheiro.
 *
 * ENQUANTO O CAMPO ESTÁ EM FOCO, o que aparece é o TEXTO DIGITADO (`buf`); a
 * formatação (`12.997,00`) só volta ao sair. É a mesma mecânica do `MoneyInput`
 * do `index.html`, e existe por um motivo concreto.
 *
 * O QUE HAVIA ANTES, E POR QUE ERA UMA ARMADILHA
 *
 * A versão anterior guardava o texto num estado e o RESSINCRONIZAVA com a prop
 * `value` num `useEffect([value])`. Como cada tecla chama `onChange`, o pai
 * atualizava o valor, a prop voltava formatada e o efeito reescrevia o campo no
 * meio da digitação:
 *
 *     digita "1"    → onChange(1) → prop 1 → campo vira "1,00", cursor no fim
 *     digita "3"    → campo "1,003" → 1.003 → toFixed(2) → "1,00"  (o 3 sumiu)
 *     digita "9"    → campo "1,009" → 1.009 → toFixed(2) → "1,01"  (subiu 1 centavo)
 *
 * Ou seja: só o primeiro dígito era aceito e o valor passava a subir de centavo
 * em centavo, uma tecla por vez. Não havia como digitar 12997.
 *
 * A lição, para quem mexer aqui: campo de moeda controlado não pode reformatar
 * enquanto se digita. Formatar é coisa do blur.
 */
function MoneyInput({ value, onChange, mudou }) {
  const [focado, setFocado] = useState(false);
  const [buf, setBuf] = useState('');
  const num = Number(value);
  const temValor = Number.isFinite(num) && num > 0;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
      <span style={{ font: '600 13px var(--font-primary)', color: 'var(--text-muted)' }}>R$</span>
      <input
        className={'inp' + (mudou ? ' mudou' : '')}
        inputMode="decimal" placeholder="0,00"
        value={focado ? buf : (temValor ? fmtMoneyPlain(num) : '')}
        onFocus={() => { setFocado(true); setBuf(temValor ? fmtMoneyPlain(num) : ''); }}
        onBlur={() => setFocado(false)}
        onChange={(e) => {
          setBuf(e.target.value);
          const p = parseMoney(e.target.value);
          // Campo vazio ou ilegível vira 0, não NaN: é o que a tela usa para
          // "sem valor" (o valor de referência da APN, por exemplo).
          onChange(Number.isFinite(p) ? p : 0);
        }}
      />
    </div>
  );
}

function Aviso({ tipo, children }) {
  const cores = {
    ok: { background: 'rgba(40,167,69,.1)', color: '#8FD79E', icone: 'check_circle' },
    erro: { background: 'rgba(220,53,69,.1)', color: '#F1969E', icone: 'error' },
    atencao: { background: 'rgba(255,193,7,.1)', color: 'var(--text-secondary)', icone: 'warning' },
    info: { background: 'var(--primary-subtle)', color: 'var(--text-secondary)', icone: 'info' },
  }[tipo] || {};
  return (
    <div className="aviso" style={{ background: cores.background, color: cores.color, border: tipo === 'info' ? '1px solid rgba(199,164,68,.3)' : 'none', marginBottom: 18 }}>
      <span className="ms-icon" style={{ fontSize: 20, color: tipo === 'info' ? 'var(--primary)' : 'inherit' }}>{cores.icone}</span>
      <span>{children}</span>
    </div>
  );
}

/* ===== Tela de entrada ===== */
function Login({ onEntrar }) {
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [erro, setErro] = useState('');
  const [carregando, setCarregando] = useState(false);

  const entrar = async (e) => {
    e.preventDefault();
    if (!email || !senha || carregando) return;
    setCarregando(true); setErro('');
    try {
      let r;
      try {
        r = await fetch('/api/sessao', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.trim(), senha }),
        });
      } catch {
        throw new Error('Sem conexão. Verifique a internet e tente de novo.');
      }
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.erro || 'Não foi possível entrar.');
      // Só a diretoria configura. Gerente entra no lobby e autoriza negociação,
      // mas aqui não teria o que fazer — e descobrir isso só ao clicar em
      // "Publicar", depois de editar tudo, seria péssimo.
      if (!d.podePublicarTabela) {
        throw new Error('Sua conta não tem permissão para configurar o catálogo. Esta área é da diretoria.');
      }
      sessao.gravar(d);
      onEntrar(d);
    } catch (err) {
      setErro(err.message);
      // Só a senha: reescrever o e-mail a cada tentativa é atrito à toa.
      setSenha('');
    } finally {
      setCarregando(false);
    }
  };

  return (
    <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 24 }}>
      <form onSubmit={entrar} className="card" style={{ width: '100%', maxWidth: 400 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
          <span className="ms-icon" style={{ color: 'var(--primary)' }}>lock</span>
          <h1 style={{ font: '700 19px var(--font-primary)', margin: 0 }}>Configuração do Lobby</h1>
        </div>
        <p style={{ font: '400 13.5px var(--font-secondary)', color: 'var(--text-muted)', margin: '0 0 22px', lineHeight: 1.5 }}>
          Área restrita à diretoria. Entre com o seu e-mail e senha do Conecta ID —
          os mesmos do kanban e do financeiro.
        </p>
        <label className="lbl">E-mail</label>
        <input
          className="inp" type="email" value={email} autoFocus autoComplete="username"
          onChange={(e) => { setEmail(e.target.value); setErro(''); }}
          placeholder="nome@sejaap.com.br"
        />
        <label className="lbl" style={{ marginTop: 14 }}>Senha</label>
        <input
          className="inp" type="password" value={senha} autoComplete="current-password"
          onChange={(e) => { setSenha(e.target.value); setErro(''); }}
          placeholder="••••••••"
        />
        {erro && (
          <div className="aviso" style={{ marginTop: 12, background: 'rgba(220,53,69,.1)', color: '#F1969E' }}>
            <span className="ms-icon" style={{ fontSize: 19 }}>error</span>{erro}
          </div>
        )}
        <button className="btn-prim" type="submit" disabled={!email || !senha || carregando} style={{ width: '100%', marginTop: 20 }}>
          {carregando ? <span className="ms-icon rot" style={{ fontSize: 19 }}>progress_activity</span> : <span className="ms-icon" style={{ fontSize: 19 }}>lock_open</span>}
          {carregando ? 'Verificando…' : 'Entrar'}
        </button>
        <div style={{ textAlign: 'center', marginTop: 16 }}>
          <a href="/esqueci-senha" style={{ font: '400 12.5px var(--font-secondary)', color: 'var(--text-muted)', textDecoration: 'none' }}>
            Esqueci minha senha
          </a>
        </div>
      </form>
    </div>
  );
}

/* ===== Aba 1: valores de tabela =========================================== */
function AbaValores({ api, catalogo, atualizadoEm, aoPublicar }) {
  const [cats, setCats] = useState(() => JSON.parse(JSON.stringify(catalogo)));
  const [original, setOriginal] = useState(() => JSON.parse(JSON.stringify(catalogo)));
  const [estado, setEstado] = useState('pronto');
  const [msg, setMsg] = useState('');

  // O catálogo pode ter mudado noutra aba (produto novo, por exemplo).
  useEffect(() => {
    setCats(JSON.parse(JSON.stringify(catalogo)));
    setOriginal(JSON.parse(JSON.stringify(catalogo)));
  }, [catalogo]);

  const setValor = (catId, prodId, valor) => {
    setCats((cs) => cs.map((c) => c.id !== catId ? c : {
      ...c,
      products: c.products.map((p) => {
        if (p.id !== prodId) return p;
        return p.recurring
          ? { ...p, monthly: valor, price: Math.round(valor * p.vigencia * 100) / 100 }
          : { ...p, price: valor };
      }),
    }));
    setMsg('');
  };

  // Categoria de fluxo próprio (a APN) não tem produto: o que se edita nela é o
  // valor com que a tela do consultor ABRE. `null` = abre em branco.
  const setValorReferencia = (catId, valor) => {
    setCats((cs) => cs.map((c) => c.id !== catId ? c : { ...c, valor_referencia: valor > 0 ? valor : null }));
    setMsg('');
  };

  // Produto de fluxo próprio (o Recrutamento e Seleção) chega SEM `price`: os
  // valores dele saem do formulário do consultor, venda a venda. Ele aparece na
  // lista para não sumir da vista da diretoria, mas sem campo para editar — e
  // fica fora do diff de alterações, senão `undefined !== undefined` marcaria
  // como mudado um produto em que ninguém tocou.
  const semTabela = (p) => !!p.flow;
  const valorDe = (p) => (p.recurring ? p.monthly : p.price);
  const achaOriginal = (catId, prodId) =>
    original?.find((c) => c.id === catId)?.products.find((p) => p.id === prodId);
  const catOriginal = (catId) => original?.find((c) => c.id === catId);

  const alteracoes = useMemo(() => {
    if (!cats || !original) return [];
    const out = [];
    for (const c of cats) {
      const oc = catOriginal(c.id);
      if (oc && (oc.valor_referencia ?? null) !== (c.valor_referencia ?? null)) {
        out.push({ cat: c.name, prod: `${c.name} (referência)`, de: oc.valor_referencia, para: c.valor_referencia });
      }
      for (const p of c.products) {
        if (semTabela(p)) continue;
        const o = achaOriginal(c.id, p.id);
        if (o && valorDe(o) !== valorDe(p)) out.push({ cat: c.name, prod: p.name, de: valorDe(o), para: valorDe(p), recorrente: !!p.recurring });
      }
    }
    return out;
  }, [cats, original]);

  const salvar = async () => {
    if (!alteracoes.length) return;
    // `— ` e não `R$ 0,00` quando não havia valor: o valor de referência da APN
    // pode ser configurado pela primeira vez, e zero ali não é o que aconteceu.
    const oValor = (v) => (v == null ? '—' : fmt(v));
    const resumo = alteracoes.map((a) => `• ${a.prod}: ${oValor(a.de)} → ${oValor(a.para)}${a.recorrente ? '/mês' : ''}`).join('\n');
    if (!confirm(`Confirmar ${alteracoes.length} alteração(ões)?\n\n${resumo}\n\nOs novos valores passam a valer imediatamente para todos os consultores.`)) return;

    setEstado('salvando'); setMsg('');
    try {
      const d = await api('/api/catalogo', { method: 'PUT', body: JSON.stringify({ cats }) });
      aoPublicar(d);
      setMsg('ok');
    } catch (err) {
      setMsg(err.message);
    } finally {
      setEstado('pronto');
    }
  };

  const descartar = () => { setCats(JSON.parse(JSON.stringify(original))); setMsg(''); };
  const sujo = alteracoes.length > 0;

  return (
    <div style={{ paddingBottom: sujo ? 90 : 0 }}>
      <Aviso tipo="info">
        Estes são os valores <strong>de tabela</strong> — o que o consultor vê ao abrir o produto.
        Salvar publica na hora, sem deploy, e fica registrado quem publicou.
        Desconto pontual por venda é outra coisa: acontece no próprio lobby, autorizado
        venda a venda por um gerente ou pela diretoria.
        {atualizadoEm && <><br /><span style={{ color: 'var(--text-muted)', fontSize: 12.5 }}>Última publicação: {dataHora(atualizadoEm)}</span></>}
      </Aviso>

      {msg === 'ok' && <Aviso tipo="ok">Valores publicados. Os consultores já veem os novos preços ao recarregar o lobby.</Aviso>}
      {msg && msg !== 'ok' && <Aviso tipo="erro">{msg}</Aviso>}

      {cats.map((c) => (
        <div key={c.id} className="card" style={{ marginBottom: 18 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>

              <div style={{ display: 'grid', gridTemplateColumns: '200px 1fr', gap: 16, alignItems: 'center' }}>

                  </div>
                </div>
              );
            }
            return (
              <div className="prod" key={p.id}>
                <div>
                  <div style={{ font: '600 14.5px var(--font-primary)' }}>{p.name}</div>
                  <div style={{ font: '400 12.5px var(--font-secondary)', color: 'var(--text-muted)', marginTop: 2 }}>

                <div>
                  <label className="lbl">{p.recurring ? 'Mensalidade' : 'Valor à vista'}</label>
                  <MoneyInput value={valorDe(p)} mudou={mudou} onChange={(v) => setValor(c.id, p.id, v)} />

                <div>
                  <label className="lbl">Total do contrato</label>

                      <span style={{ font: '400 11.5px var(--font-secondary)', color: 'var(--text-muted)', marginLeft: 6 }}>
                        ({p.vigencia}×)
                      </span>

            );

        </div>
      ))}

      {sujo && (
        <div style={{ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 10, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap', padding: '16px 28px', background: 'rgba(30,30,28,.97)', backdropFilter: 'blur(10px)', borderTop: '1px solid rgba(199,164,68,.35)' }}>
          <div style={{ font: '500 13.5px var(--font-secondary)', color: 'var(--text-secondary)' }}>

          <div style={{ display: 'flex', gap: 12 }}>
            <button className="btn-ghost" onClick={descartar} disabled={estado === 'salvando'}>Descartar</button>
            <button className="btn-prim" onClick={salvar} disabled={estado === 'salvando'}>
              {estado === 'salvando'
                ? <><span className="ms-icon rot" style={{ fontSize: 19 }}>progress_activity</span>Publicando…</>
                : <><span className="ms-icon" style={{ fontSize: 19 }}>cloud_upload</span>Publicar valores</>}
            </button>

        </div>
      )}

  );
}

// Explica a regra com a data de hoje, porque "mes_seguinte" não diz nada a quem
// só quer saber quando o cliente vai ser cobrado.
function exemploDeCronograma(regra) {
  const hoje = new Date();
  const dia = regra.dia_vencimento;
  const antecipa = regra.primeiro_vencimento === 'proximo' && hoje.getDate() < dia ? 1 : 0;
  const entrada = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + (regra.entrada_prazo_dias || 0));
  const parcelas = [0, 1, 2].map((i) => new Date(hoje.getFullYear(), hoje.getMonth() + 1 - antecipa + i, dia));
  const br = (d) => d.toLocaleDateString('pt-BR');
  return { entrada: br(entrada), parcelas: parcelas.map(br) };
}

function CamposDaRegra({ regra, opcoes, onChange, compacto }) {
  const num = (campo, valor) => {
    const n = Math.round(Number(valor));
    onChange({ ...regra, [campo]: Number.isFinite(n) ? n : 0 });
  };
  return (
    <div style={{ display: 'grid', gridTemplateColumns: compacto ? '110px 1fr 130px' : '160px 1fr 180px', gap: 12 }}>
      <div>
        <label className="lbl">Dia do vencimento</label>
        <input className={'inp' + (compacto ? ' sm' : '')} type="number" min={opcoes.dia_vencimento.min} max={opcoes.dia_vencimento.max}
          value={regra.dia_vencimento} onChange={(e) => num('dia_vencimento', e.target.value)} />
      </div>
      <div>
        <label className="lbl">Primeira parcela</label>
        <select className={'inp' + (compacto ? ' sm' : '')} value={regra.primeiro_vencimento} onChange={(e) => onChange({ ...regra, primeiro_vencimento: e.target.value })}>
          {opcoes.primeiro_vencimento.map((o) => <option key={o.valor} value={o.valor}>{o.rotulo}</option>)}
        </select>
      </div>
      <div>
        <label className="lbl">Prazo da entrada<span className="dica">dias</span></label>
        <input className={'inp' + (compacto ? ' sm' : '')} type="number" min="0" max={opcoes.entrada_prazo_dias.max}
          value={regra.entrada_prazo_dias} onChange={(e) => num('entrada_prazo_dias', e.target.value)} />
      </div>
    </div>
  );
}

function AbaCobranca({ api, catalogo, aoPublicar }) {
  const [dados, setDados] = useState(null);
  const [original, setOriginal] = useState(null);
  const [estado, setEstado] = useState('carregando');
  const [msg, setMsg] = useState('');
  const [novoProduto, setNovoProduto] = useState('');

  const carregar = useCallback(async () => {
    setEstado('carregando'); setMsg('');
    try {
      const d = await api('/api/cobranca');
      setDados(d);
      setOriginal(JSON.parse(JSON.stringify(d)));
      setEstado('pronto');
    } catch (err) { setMsg(err.message); setEstado('erro'); }
  }, [api]);

  useEffect(() => { carregar(); }, [carregar]);

  if (estado === 'carregando') return <Carregando />;
  if (estado === 'erro') return <Falhou msg={msg} aoTentar={carregar} />;

  const opcoes = dados.opcoes;
  const sujo = JSON.stringify({ geral: dados.geral, excecoes: dados.excecoes }) !== JSON.stringify({ geral: original.geral, excecoes: original.excecoes });

  // Produtos que ainda não têm exceção — só eles podem ser acrescentados.
  const semExcecao = [];
  for (const c of catalogo) {
    if (c.flow) continue;
    for (const p of c.products) {
      // Produto de fluxo próprio não monta cronograma de parcelas: cada vaga do
      // formulário tem a sua data. Uma "exceção de cobrança" nele seria uma
      // regra que nenhuma tela lê.
      if (p.flow) continue;
      if (!dados.excecoes.some((e) => e.categoria_id === c.id && e.produto_id === p.id)) {
        semExcecao.push({ categoria_id: c.id, produto_id: p.id, nome: `${c.name} · ${p.name}` });
      }
    }
  }

  const acrescentaExcecao = () => {
    const alvo = semExcecao.find((p) => `${p.categoria_id}/${p.produto_id}` === novoProduto);
    if (!alvo) return;
    setDados({
      ...dados,
      excecoes: [...dados.excecoes, {
        categoria_id: alvo.categoria_id, produto_id: alvo.produto_id,
        produto_nome: alvo.nome, ...dados.geral,
      }],
    });
    setNovoProduto(''); setMsg('');
  };

  const mudaExcecao = (indice, regra) => setDados({
    ...dados,
    excecoes: dados.excecoes.map((e, i) => i === indice ? { ...e, ...regra } : e),
  });

  const removeExcecao = (indice) => setDados({
    ...dados, excecoes: dados.excecoes.filter((_, i) => i !== indice),
  });

  const salvar = async () => {
    setEstado('salvando'); setMsg('');
    try {
      const d = await api('/api/cobranca', {
        method: 'PUT',
        body: JSON.stringify({ geral: dados.geral, excecoes: dados.excecoes }),
      });
      setDados({ ...dados, ...d });
      setOriginal(JSON.parse(JSON.stringify({ ...dados, ...d })));
      setMsg('ok');
      aoPublicar();
    } catch (err) { setMsg(err.message); }
    finally { setEstado('pronto'); }
  };

  const exemplo = exemploDeCronograma(dados.geral);

  return (
    <div style={{ paddingBottom: sujo ? 90 : 0 }}>
      <Aviso tipo="info">
        Estas datas valem para <strong>todas as vendas a partir de agora</strong> — é com elas que o
        cronograma abre na tela do consultor. Mudar a data de UMA venda continua sendo
        autorização de gerente, no próprio lobby.
      </Aviso>

      {msg === 'ok' && <Aviso tipo="ok">Datas publicadas. O próximo consultor a abrir o lobby já monta o cronograma com elas.</Aviso>}
      {msg && msg !== 'ok' && <Aviso tipo="erro">{msg}</Aviso>}

      <div className="card" style={{ marginBottom: 18 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
          <span className="ms-icon" style={{ color: 'var(--primary)', fontSize: 21 }}>event_repeat</span>
          <h2 style={{ font: '700 16px var(--font-primary)', margin: 0 }}>Regra do Lobby</h2>
          <span className="chip neutro">vale para todo produto sem exceção</span>
        </div>

        <CamposDaRegra regra={dados.geral} opcoes={opcoes} onChange={(g) => { setDados({ ...dados, geral: g }); setMsg(''); }} />

        <div style={{ marginTop: 18, padding: '14px 16px', borderRadius: 10, background: 'var(--surface-elevated)', border: '1px solid var(--border-light)' }}>
          <div className="sec-title" style={{ marginBottom: 8 }}>Como fica uma venda fechada hoje</div>
          <div style={{ font: '400 13.5px/1.7 var(--font-secondary)', color: 'var(--text-secondary)' }}>
            Entrada em <strong style={{ color: 'var(--primary)' }}>{exemplo.entrada}</strong>
            {' '}· parcelas em <strong style={{ color: 'var(--primary)' }}>{exemplo.parcelas.join(', ')}</strong>…
          </div>
          <div style={{ font: '400 12px var(--font-secondary)', color: 'var(--text-muted)', marginTop: 6 }}>
            O dia do vencimento vai até {opcoes.dia_vencimento.max}: 29, 30 e 31 não existem em todo mês,
            e o ponto de fixar o dia é ter uma data única de cobrança.
          </div>
        </div>
      </div>

      <div className="card">
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
          <span className="ms-icon" style={{ color: 'var(--primary)', fontSize: 21 }}>rule</span>
          <h2 style={{ font: '700 16px var(--font-primary)', margin: 0 }}>Exceções por produto</h2>
        </div>
        <p style={{ font: '400 13px/1.55 var(--font-secondary)', color: 'var(--text-muted)', margin: '0 0 16px' }}>
          Produto sem exceção segue a regra do Lobby. Remover a exceção devolve o produto
          à regra geral — e o histórico registra até quando ela valeu.
        </p>

        {dados.excecoes.length === 0 && (
          <div style={{ font: '400 13px var(--font-secondary)', color: 'var(--text-muted)', padding: '10px 0 18px' }}>
            Nenhuma exceção — todos os produtos cobram no dia {dados.geral.dia_vencimento}.
          </div>
        )}

        {dados.excecoes.map((e, i) => (
          <div key={`${e.categoria_id}/${e.produto_id}`} style={{ padding: '14px 0', borderTop: i ? '1px solid var(--border-light)' : 'none' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, marginBottom: 10 }}>
              <strong style={{ font: '600 14px var(--font-primary)' }}>{e.produto_nome || `${e.categoria_id}/${e.produto_id}`}</strong>
              <button className="btn-ghost sm btn-perigo" onClick={() => removeExcecao(i)}>
                <span className="ms-icon" style={{ fontSize: 17 }}>close</span>Remover exceção
              </button>
            </div>
            <CamposDaRegra compacto regra={e} opcoes={opcoes} onChange={(r) => mudaExcecao(i, r)} />
          </div>
        ))}

        {semExcecao.length > 0 && (
          <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end', marginTop: 18, paddingTop: 16, borderTop: '1px solid var(--border-light)', flexWrap: 'wrap' }}>
            <div style={{ minWidth: 280, flex: 1 }}>
              <label className="lbl">Acrescentar exceção</label>
              <select className="inp sm" value={novoProduto} onChange={(ev) => setNovoProduto(ev.target.value)}>
                <option value="">Escolha o produto…</option>
                {semExcecao.map((p) => (
                  <option key={`${p.categoria_id}/${p.produto_id}`} value={`${p.categoria_id}/${p.produto_id}`}>{p.nome}</option>
                ))}
              </select>
            </div>
            <button className="btn-ghost sm" onClick={acrescentaExcecao} disabled={!novoProduto}>
              <span className="ms-icon" style={{ fontSize: 18 }}>add</span>Acrescentar
            </button>
          </div>
        )}
      </div>

      {sujo && (
        <div style={{ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 10, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap', padding: '16px 28px', background: 'rgba(30,30,28,.97)', backdropFilter: 'blur(10px)', borderTop: '1px solid rgba(199,164,68,.35)' }}>
          <div style={{ font: '500 13.5px var(--font-secondary)', color: 'var(--text-secondary)' }}>
            Datas de cobrança alteradas, ainda não publicadas.
          </div>
          <div style={{ display: 'flex', gap: 12 }}>
            <button className="btn-ghost" onClick={() => { setDados(JSON.parse(JSON.stringify(original))); setMsg(''); }} disabled={estado === 'salvando'}>Descartar</button>
            <button className="btn-prim" onClick={salvar} disabled={estado === 'salvando'}>
              {estado === 'salvando'
                ? <><span className="ms-icon rot" style={{ fontSize: 19 }}>progress_activity</span>Publicando…</>
                : <><span className="ms-icon" style={{ fontSize: 19 }}>cloud_upload</span>Publicar datas</>}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const PRODUTO_VAZIO = {

  recorrente: true, mensalidade: '', vigencia_meses: 12, valor: '',
};

          <div>

              <option value="sim">Recorrente (mensalidade)</option>

            </select>

              <input className="inp" inputMode="decimal" placeholder="39997" {...campo('mensalidade')} />
            </div>
            <div>
              <label className="lbl">Vigência<span className="dica">meses</span></label>
              <input className="inp" type="number" min="1" max="120" {...campo('vigencia_meses')} />

          </button>

  );
}

function AbaProdutos({ api, catalogo, aoPublicar }) {
  const [editando, setEditando] = useState(null);   // {categoria_id, slug, ...} ou 'novo'
  const [salvando, setSalvando] = useState(false);
  const [msg, setMsg] = useState('');

  const paraFormulario = (c, p) => ({
    categoria_id: c.id, slug: p.id, nome: p.name, sigla: p.sigla, descricao: p.desc,
    duracao: p.duration, icone: p.icon, recorrente: !!p.recurring,
    mensalidade: p.recurring ? String(p.monthly) : '', vigencia_meses: p.vigencia || 12,
    valor: (p.recurring || p.flow) ? '' : String(p.price),
    // Produto de fluxo próprio: sem preço, e o formulário esconde esse bloco. O
    // backend descarta os campos de valor que chegarem, mas mostrá-los aqui
    // convidaria a diretoria a preencher um número que não vale nada.
    fluxo: p.flow || '',
  });

  const salvar = async (f) => {
    setSalvando(true); setMsg('');
    const corpo = {
      categoria_id: f.categoria_id, nome: f.nome.trim(), sigla: f.sigla, descricao: f.descricao,
      duracao: f.duracao, icone: f.icone,
      // Produto de fluxo próprio: só texto. O backend descartaria os campos de
      // valor de qualquer jeito, mas mandar `recorrente` num produto sem preço
      // é dizer algo que não é verdade sobre ele.
      ...(f.fluxo ? {} : {
        recorrente: f.recorrente,
        ...(f.recorrente
          ? { mensalidade: String(f.mensalidade).replace(',', '.'), vigencia_meses: Number(f.vigencia_meses) }
          : { valor: String(f.valor).replace(',', '.') }),
      }),
    };
    try {
      if (editando === 'novo') await api('/api/produtos', { method: 'POST', body: JSON.stringify(corpo) });
      else await api(`/api/produtos/${f.categoria_id}/${f.slug}`, { method: 'PATCH', body: JSON.stringify(corpo) });
      setEditando(null);
      setMsg('ok');
      aoPublicar();
    } catch (err) { setMsg(err.message); }
    finally { setSalvando(false); }
  };

  return (
    <div>
      <Aviso tipo="info">
        Criar e editar produto aqui <strong>fica registrado</strong>: cada mudança de valor abre uma
        vigência na aba Histórico, com o seu nome. O mesmo pelo <code>/django-admin/</code> não deixa
        rastro nenhum — use-o só para conserto.
        <br />
        <span style={{ color: 'var(--text-muted)', fontSize: 12.5 }}>
          Não há remoção: produto vendido aparece no protocolo de vendas já fechadas, e apagá-lo
          deixaria esses protocolos órfãos. Para tirar de circulação, trave a categoria.
        </span>
      </Aviso>

      {msg === 'ok' && <Aviso tipo="ok">Catálogo atualizado. Os consultores já veem a mudança ao recarregar o lobby.</Aviso>}
      {msg && msg !== 'ok' && <Aviso tipo="erro">{msg}</Aviso>}

      {editando && (
        <FormularioProduto
          novo={editando === 'novo'}
          inicial={editando === 'novo' ? PRODUTO_VAZIO : editando}
          categorias={catalogo}
          salvando={salvando}
          onSalvar={salvar}
          onCancelar={() => { setEditando(null); setMsg(''); }}
        />
      )}

      {!editando && (
        <button className="btn-prim" style={{ marginBottom: 18 }} onClick={() => { setEditando('novo'); setMsg(''); }}>
          <span className="ms-icon" style={{ fontSize: 19 }}>add</span>Novo produto
        </button>
      )}

      {catalogo.map((c) => (
        <div key={c.id} className="card" style={{ marginBottom: 18 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
            <span className="ms-icon" style={{ color: 'var(--primary)', fontSize: 21 }}>{c.icon}</span>
            <h2 style={{ font: '700 16px var(--font-primary)', margin: 0 }}>{c.name}</h2>
            {c.locked && <span className="chip neutro">Em implementação</span>}
            {c.flow && <span className="chip neutro">Fluxo próprio · sem tabela</span>}
          </div>

          {c.flow ? (
            <div style={{ font: '400 13px var(--font-secondary)', color: 'var(--text-muted)' }}>
              O consultor informa o valor da venda. Não há produto a cadastrar aqui.
            </div>
          ) : (
            <>
              <div className="linha cab">
                <div>Produto</div><div>Sigla</div><div>Valor</div><div>Cobrança</div><div></div>
              </div>
              {c.products.map((p) => (
                <div className="linha" key={p.id}>
                  <div>
                    <div style={{ font: '600 14px var(--font-primary)' }}>{p.name}</div>
                    <div style={{ font: '400 12px var(--font-secondary)', color: 'var(--text-muted)', marginTop: 2 }}>
                      {p.desc}{p.duration ? ` · ${p.duration}` : ''} · id <code>{p.id}</code>
                    </div>
                  </div>
                  <div><span className="chip">{p.sigla}</span></div>
                  <div style={{ font: '400 13px var(--font-secondary)', color: 'var(--text-secondary)' }}>
                    {p.flow ? <span style={{ color: 'var(--text-muted)' }}>—</span>
                      : p.recurring ? <>{fmt(p.monthly)}<span style={{ color: 'var(--text-muted)' }}>/mês</span></> : fmt(p.price)}
                  </div>
                  <div style={{ font: '400 12.5px var(--font-secondary)', color: 'var(--text-muted)' }}>
                    {p.flow ? 'formulário próprio' : p.recurring ? `${p.vigencia} meses` : 'à vista'}
                    {p.cobranca && !p.flow && <div style={{ color: 'var(--primary)' }}>dia {p.cobranca.dia_vencimento} (exceção)</div>}
                  </div>
                  <div>
                    <button className="btn-ghost sm" onClick={() => { setEditando(paraFormulario(c, p)); setMsg(''); }}>
                      <span className="ms-icon" style={{ fontSize: 17 }}>edit</span>Editar
                    </button>
                  </div>
                </div>
              ))}
              {c.products.length === 0 && (
                <div style={{ font: '400 13px var(--font-secondary)', color: 'var(--text-muted)', padding: '8px 0' }}>
                  Nenhum produto nesta categoria ainda.
                </div>
              )}
            </>
          )}
        </div>
      ))}
    </div>
  );
}

/* ===== Aba 4: histórico =================================================== */
function AbaHistorico({ api, catalogo }) {
  const [registros, setRegistros] = useState(null);
  const [estado, setEstado] = useState('carregando');
  const [msg, setMsg] = useState('');
  const [filtro, setFiltro] = useState('');

  const carregar = useCallback(async (chave) => {
    setEstado('carregando'); setMsg('');
    try {
      const d = await api('/api/historico' + (chave ? `?chave=${encodeURIComponent(chave)}` : ''));
      setRegistros(d.registros);
      setEstado('pronto');
    } catch (err) { setMsg(err.message); setEstado('erro'); }
  }, [api]);

  useEffect(() => { carregar(filtro); }, [carregar, filtro]);

  const alvos = [{ chave: 'geral', nome: 'Política de cobrança' }];
  for (const c of catalogo) for (const p of c.products) alvos.push({ chave: p.id, nome: `${c.name} · ${p.name}` });

  // Dinheiro é guardado como texto ("12997.00") porque a mesma coluna serve para
  // dia do mês e para escolha de regra. A tela sabe o tipo pelo campo.
  const mostraValor = (r) => {
    if (r.campo === 'mensalidade' || r.campo === 'valor') return fmt(Number(r.valor));
    if (r.campo === 'primeiro_vencimento') return r.valor === 'proximo' ? 'primeiro dia depois da venda' : 'mês seguinte';
    if (r.campo === 'dia_vencimento') return `dia ${r.valor}`;
    if (r.campo === 'entrada_prazo_dias') return Number(r.valor) === 0 ? 'no dia da venda' : `${r.valor} dias`;
    if (r.campo === 'vigencia_meses') return `${r.valor} meses`;
    return r.valor;
  };

  return (
    <div>
      <Aviso tipo="info">
        Cada valor e cada data com o período em que <strong>valeu de fato</strong> — é o que responde
        "quanto custava em março" sem precisar reconstruir nada. Registros sem autor vieram da
        semente inicial do catálogo: não houve pessoa, houve migração.
      </Aviso>

      <div className="card">
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 14, marginBottom: 16, flexWrap: 'wrap' }}>
          <div style={{ minWidth: 300 }}>
            <label className="lbl">Filtrar</label>
            <select className="inp sm" value={filtro} onChange={(e) => setFiltro(e.target.value)}>
              <option value="">Tudo</option>
              {alvos.map((a) => <option key={a.chave} value={a.chave}>{a.nome}</option>)}
            </select>
          </div>
          <button className="btn-ghost sm" onClick={() => carregar(filtro)}>
            <span className="ms-icon" style={{ fontSize: 17 }}>refresh</span>Atualizar
          </button>
        </div>

        {estado === 'carregando' && <Carregando />}
        {estado === 'erro' && <Falhou msg={msg} aoTentar={() => carregar(filtro)} />}

        {estado === 'pronto' && (
          registros.length === 0
            ? <div style={{ font: '400 13px var(--font-secondary)', color: 'var(--text-muted)', padding: '10px 0' }}>Nada registrado ainda.</div>
            : (
              <>
                <div className="tl cab">
                  <div>Período</div><div>O quê</div><div>Valor</div><div>Quem publicou</div>
                </div>
                {registros.map((r, i) => (
                  <div className="tl" key={i}>
                    <div style={{ color: r.vigente ? 'var(--primary)' : 'var(--text-muted)', font: r.vigente ? "600 12.5px 'Roboto'" : "400 12.5px 'Roboto'" }}>
                      {dataHora(r.vigente_de).split(',')[0]}
                      <div style={{ font: '400 11px var(--font-secondary)', color: 'var(--text-muted)' }}>
                        {r.vigente ? 'até hoje' : `até ${dataHora(r.vigente_ate).split(',')[0]}`}
                      </div>
                    </div>
                    <div>
                      <span style={{ font: '500 13px var(--font-secondary)' }}>{r.rotulo}</span>
                      <div style={{ font: '400 11.5px var(--font-secondary)', color: 'var(--text-muted)' }}>{r.campo_rotulo}</div>
                    </div>
                    <div style={{ font: "600 13px 'Roboto'", color: r.vigente ? 'var(--text)' : 'var(--text-muted)' }}>{mostraValor(r)}</div>
                    <div style={{ font: '400 12px var(--font-secondary)', color: 'var(--text-muted)' }}>{r.autor || 'sistema'}</div>
                  </div>
                ))}
              </>
            )
        )}
      </div>
    </div>
  );
}

/* ===== Estados compartilhados ============================================= */
function Carregando() {
  return (
    <div style={{ display: 'grid', placeItems: 'center', padding: 40, color: 'var(--text-muted)' }}>
      <span className="ms-icon rot" style={{ fontSize: 30 }}>progress_activity</span>
    </div>
  );
}

function Falhou({ msg, aoTentar }) {
  return (
    <div className="card" style={{ maxWidth: 440, margin: '0 auto', textAlign: 'center' }}>
      <span className="ms-icon" style={{ fontSize: 34, color: 'var(--danger)' }}>cloud_off</span>
      <p style={{ font: '400 14px var(--font-secondary)', color: 'var(--text-secondary)', lineHeight: 1.55 }}>{msg}</p>
      <button className="btn-ghost" onClick={aoTentar} style={{ margin: '0 auto' }}>
        <span className="ms-icon" style={{ fontSize: 19 }}>refresh</span>Tentar de novo
      </button>
    </div>
  );
}

/* ===== Casca: abas, sessão e o catálogo compartilhado ===================== */
const ABAS = [
  { id: 'valores', rotulo: 'Valores', icone: 'sell' },
  { id: 'cobranca', rotulo: 'Cobrança', icone: 'event_repeat' },
  { id: 'produtos', rotulo: 'Produtos', icone: 'inventory_2' },
  { id: 'historico', rotulo: 'Histórico', icone: 'history' },
];

function Editor({ sessao: sess, aoSair }) {
  const [aba, setAba] = useState('valores');
  const [catalogo, setCatalogo] = useState(null);
  const [atualizadoEm, setAtualizadoEm] = useState(null);
  const [estado, setEstado] = useState('carregando');
  const [msg, setMsg] = useState('');

  const api = useMemo(() => criaApi(sess.token, aoSair), [sess.token, aoSair]);

  // O catálogo vive aqui, e não em cada aba: criar produto numa aba tem que
  // aparecer nas outras sem recarregar a página.
  const carregar = useCallback(async () => {
    setEstado('carregando'); setMsg('');
    try {
      const d = await api('/api/catalogo');
      setCatalogo(d.cats);
      setAtualizadoEm(d.atualizadoEm);
      setEstado('pronto');
    } catch (err) { setMsg(err.message); setEstado('erro'); }
  }, [api]);

  useEffect(() => { carregar(); }, [carregar]);

  const aoPublicar = useCallback((d) => {
    if (d?.cats) { setCatalogo(d.cats); setAtualizadoEm(d.atualizadoEm); }
    else carregar();
  }, [carregar]);

  return (
    <div style={{ minHeight: '100vh' }}>
      <div style={{ position: 'sticky', top: 0, zIndex: 5, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, height: 64, padding: '0 28px', background: 'rgba(20,20,18,.92)', backdropFilter: 'blur(8px)', borderBottom: '1px solid var(--border-light)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span className="ms-icon" style={{ color: 'var(--primary)' }}>tune</span>
          <strong style={{ font: '700 15px var(--font-primary)' }}>Configuração do Lobby</strong>
          <span className="chip">{sess.nome || sess.email}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <a href="/" style={{ font: '600 12.5px var(--font-primary)', color: 'var(--text-muted)', textDecoration: 'none' }}>Ir para o lobby</a>
          <button className="btn-ghost" style={{ height: 38, padding: '0 14px' }} onClick={() => { sessao.limpar(); aoSair(); }}>
            <span className="ms-icon" style={{ fontSize: 18 }}>logout</span>Sair
          </button>
        </div>
      </div>

      <div style={{ maxWidth: 1000, margin: '0 auto', padding: '24px 24px 48px' }}>
        {sess.precisaTrocarSenha && (
          <Aviso tipo="atencao">
            A sua senha do Conecta ID está marcada para troca — provavelmente é a senha inicial.
            Peça o link em <a href="/esqueci-senha" style={{ color: 'var(--primary)' }}>/esqueci-senha</a>:
            ele chega no seu e-mail. Você pode continuar publicando normalmente.
          </Aviso>
        )}

        <div className="abas">
          {ABAS.map((a) => (
            <button key={a.id} className={'aba' + (aba === a.id ? ' on' : '')} onClick={() => setAba(a.id)}>
              <span className="ms-icon" style={{ fontSize: 18 }}>{a.icone}</span>{a.rotulo}
            </button>
          ))}
        </div>

        {estado === 'carregando' && <Carregando />}
        {estado === 'erro' && <Falhou msg={msg} aoTentar={carregar} />}
        {estado === 'pronto' && (
          <>
            {aba === 'valores' && <AbaValores api={api} catalogo={catalogo} atualizadoEm={atualizadoEm} aoPublicar={aoPublicar} />}
            {aba === 'cobranca' && <AbaCobranca api={api} catalogo={catalogo} aoPublicar={aoPublicar} />}
            {aba === 'produtos' && <AbaProdutos api={api} catalogo={catalogo} aoPublicar={aoPublicar} />}
            {aba === 'historico' && <AbaHistorico api={api} catalogo={catalogo} />}
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  // `sessao` guarda o objeto inteiro (token, nome, e-mail, papel), não só o
  // token — é o que permite mostrar quem está publicando no cabeçalho.
  const [sess, setSess] = useState(sessao.ler());
  const sair = useCallback(() => setSess(null), []);
  return sess ? <Editor sessao={sess} aoSair={sair} /> : <Login onEntrar={setSess} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
