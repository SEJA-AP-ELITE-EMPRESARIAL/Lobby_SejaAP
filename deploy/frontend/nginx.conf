# nginx do container do Lobby.
#
# Serve os dois arquivos do app e faz proxy do que é Django. Fica atrás do nginx
# do HOST, que por sua vez fica atrás da Cloudflare:
#
#   navegador → Cloudflare → nginx do host (TLS) → este container → backend
#
# O lobby não tem build: `index.html` transpila React com Babel no navegador e
# puxa as bibliotecas de CDN (unpkg, jsdelivr, fonts.googleapis). Não há nenhum
# asset local — por isso este container copia exatamente dois arquivos.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # POR QUE O UPSTREAM É UMA VARIÁVEL, E NÃO `proxy_pass http://backend:8000`
    #
    # Com o nome literal, o nginx resolve o DNS UMA VEZ, ao iniciar — e se o
    # backend não estiver de pé naquele instante, ele recusa a subir inteiro.
    # Isso destruiria a resiliência que o lobby tem de propósito: o index.html
    # carrega com a tabela de preços embutida quando a API não responde
    # (`boot()`, index.html:2216-2228), justamente para o consultor continuar
    # cotando em campo. De nada adianta esse fallback se o servidor que entrega
    # o HTML morre junto com a API.
    #
    # Com `resolver` + variável, o nome é resolvido a cada requisição: o nginx
    # sobe sempre, /api/ devolve 502 enquanto o backend estiver fora, e o lobby
    # segue de pé no modo degradado. 127.0.0.11 é o DNS embutido do Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_backend "backend:8000";

    # O HTML É o aplicativo: cada deploy muda o arquivo inteiro. Sem isto, um
    # consultor com a página em cache continua vendo a versão antiga — incluindo
    # a tabela de preços embutida no fallback.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # `/admin` é a tela de valores da diretoria (admin.html), não o admin do
    # Django. Na Cloudflare Pages a resolução sem extensão era automática; aqui
    # é explícita. O admin do Django mora em /django-admin/ justamente para não
    # disputar esta rota.
    location = /admin {
        try_files /admin.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /admin/ {
        return 301 /admin;
    }

    # API do catálogo. O front chama por URL relativa, então front e API têm que
    # sair da mesma origem — é o que torna `django-cors-headers` desnecessário.
    location /api/ {
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # O X-Forwarded-For é como o backend descobre o IP do usuário final.
        # Ele importa mais do que parece: é esse IP que vai ao Conecta ID no
        # login (o serviço só enxerga o IP do container, não o de quem digitou).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sem isto o SECURE_SSL_REDIRECT do Django responde 301 para https e o
        # PUT do admin perde o corpo no caminho.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location /django-admin/ {
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Estáticos do admin do Django (WhiteNoise). O lobby não usa.
    location /static/ {
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
