# vhost do lobby.sejaap.com.br no nginx do HOST (prod.solucoes, 187.77.48.164).
#
# Instalar:
#   cp deploy/nginx-host-lobby.conf /etc/nginx/sites-available/lobby.conf
#   ln -s /etc/nginx/sites-available/lobby.conf /etc/nginx/sites-enabled/lobby.conf
#   nginx -t && systemctl reload nginx
#
# O certificado é um Cloudflare Origin Certificate curinga (*.sejaap.com.br) e
# só vale entre a Cloudflare e esta VPS. Por isso o registro DNS PRECISA ficar
# proxiado (nuvem laranja) e o SSL/TLS em Full (strict). Em "DNS only" o
# navegador fala direto com a VPS e recusa o certificado.
#
# ATENÇÃO: o nginx desta VPS é anterior ao 1.25.1, então a sintaxe é
# `listen 443 ssl http2;` — a forma nova (`http2 on;`) não é reconhecida e
# derruba o `nginx -t`.

server {
    listen 80;
    listen [::]:80;
    server_name lobby.sejaap.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lobby.sejaap.com.br;

    ssl_certificate     /opt/conecta/secrets/cf-origin.pem;
    ssl_certificate_key /opt/conecta/secrets/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # O catálogo é pequeno; o que pesa é o HTML de ~2.200 linhas.
    # `text/html` NÃO entra na lista: o nginx sempre o comprime, e repeti-lo
    # aqui gera "duplicate MIME type" no `nginx -t`.
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # O consultor manda CNPJ e dados de cadastro; nada aqui é grande, mas o
    # default de 1M é apertado demais para um POST com muitos campos.
    client_max_body_size 4m;

    access_log /var/log/nginx/lobby.access.log;
    error_log  /var/log/nginx/lobby.error.log;

    location / {
        # 8095 é a porta do container `lobby-frontend`. Ver docker-compose.yml —
        # e conferir o RUNBOOK antes de mexer, porque a lista de portas dos apps
        # vizinhos vive lá.
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # CF-Connecting-IP é o IP real de quem acessou; sem repassá-lo, o backend
        # e o Conecta ID enxergam apenas o IP da borda da Cloudflare.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
