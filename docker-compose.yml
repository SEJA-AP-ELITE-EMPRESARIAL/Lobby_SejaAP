# Lobby Seja AP — stack de produção.
#   docker compose up -d --build
#
# Roda em prod.solucoes.sejaap (187.77.48.164), ao lado do kanban, do
# conecta-crm, do formulario-financeiro e do Conecta ID. O banco NÃO fica nesta
# VPS: Postgres `lobby` na db-sejaap (179.197.237.95), alcançado por `db-tunnel`.
#
# O subdomínio lobby.sejaap.com.br aponta para o nginx do HOST, que faz proxy
# para a porta 8095 exposta aqui no loopback. Portas vizinhas já tomadas:
#   8090 conecta-crm · 8091 kanban-frontend · 8092 kanban-mcp
#   8093 formularios · 8094 identidade-api (admin, só por túnel SSH)
name: lobby-sejaap

services:
  db-tunnel:
    build: ./deploy/db-tunnel
    image: lobby-db-tunnel:prod
    container_name: lobby-db-tunnel
    restart: unless-stopped
    environment:
      TUNNEL_HOST: "179.197.237.95"
      TUNNEL_USER: "root"
      TUNNEL_PORT: "22"
    volumes:
      - /opt/conecta/env/lobby_db_tunnel_key:/keys/id:ro
      - /opt/conecta/env/lobby_db_known_hosts:/keys/known_hosts:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build: ./backend
    container_name: lobby-backend
    env_file: .env
    restart: unless-stopped
    depends_on:
      db-tunnel:
        condition: service_started
      # Sem o Redis de pé o backend nem sobe: é nele que mora o `jti` da
      # asserção do Conecta. Só vale para a SUBIDA — se o Redis cair depois, o
      # backend segue servindo (ver o bloco `redis` abaixo).
      redis:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      # SÓ para o Prometheus, que roda em network_mode: host e precisa alcançar
      # o /metrics. Loopback, nunca 0.0.0.0.
      #
      # POR QUE NÃO COLETAR PELA 8095, QUE JÁ EXISTE
      #
      # A 8095 é o container do FRONT, e o vhost do host encaminha `location /`
      # inteiro para lá. Fazer o /metrics passar por ele o publicaria em
      # lobby.sejaap.com.br/metrics — protegido por token, mas exposto à
      # internet sem precisar. Por esta porta o caminho público simplesmente
      # não existe. É o mesmo desenho do identidade-api na 8094.
      - "127.0.0.1:8096:8000"
    networks:
      # `default` PRECISA estar listada. Declarar `networks:` num serviço que não
      # tinha o tira da rede padrão do compose — e o backend perderia o db-tunnel
      # e o frontend de uma vez, por um detalhe de sintaxe.
      - default
      # Rede compartilhada, criada pela stack do Conecta ID. É por ela que este
      # backend vai alcançar `identidade-api:8000` para verificar credencial
      # (TSK-125). Já declarada aqui para que a migração não precise mexer no
      # compose depois.
      - identidade-net
    healthcheck:
      # O X-Forwarded-Proto não é decoração: com DEBUG=false o SECURE_SSL_REDIRECT
      # responde 301 para https, e sem o header o urllib tentaria TLS contra o
      # gunicorn em texto claro — o healthcheck nunca passaria.
      #
      # Bate no GET público do catálogo de propósito: é a rota que precisa estar
      # de pé para o consultor cotar. Se ela responde, o app serve.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/catalogo', headers={'X-Forwarded-Proto': 'https'}), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    # Cache compartilhado do backend (TSK-1068), em LOBBY_REDIS_URL. Serve a dois
    # aliases do `CACHES` (backend/config/settings.py):
    #   assercao  o `jti` da asserção do Conecta (ADR-002 §4.6). Falha FECHADA:
    #             sem este Redis a integração responde 503.
    #   default   os tetos de chamada (LOBBY_RATE_*). Falha ABERTA: sem este
    #             Redis o lobby do consultor segue vendendo, só sem contar.
    #
    # Próprio do Lobby, e não o `identidade-redis` do Conecta ID: aquele está na
    # rede fechada `identidade_interna` e não tem senha — abri-lo à
    # `identidade-net` o exporia a todo app da rede (decisão de 15/10/2026).
    #
    # SÓ na rede `default` deste compose: sem `ports` e fora da `identidade-net`.
    # Quem fala com ele é o backend, e mais ninguém.
    image: redis:7-alpine
    container_name: lobby-redis
    restart: unless-stopped
    # Não roda como root: o `sh` abaixo não passa pelo entrypoint que troca de
    # usuário (ele só faz isso quando o comando é `redis-server`).
    user: redis
    networks:
      - default
    environment:
      # A senha, lida do .env deste diretório (o link para o lobby.env). O
      # `redis-cli` do healthcheck a usa sozinho por esta variável. Sem ela o
      # compose para ANTES de subir qualquer coisa — um Redis sem senha não sobe.
      REDISCLI_AUTH: ${LOBBY_REDIS_SENHA:?defina LOBBY_REDIS_SENHA no .env - ver deploy/RUNBOOK.md}
    # A senha vai por arquivo, e não por `--requirepass` na linha de comando: o
    # argv de processo de container aparece no `ps` de qualquer usuário do host.
    #
    # Sem persistência (`save ""`, sem AOF): é cache. Reiniciar o Redis zera os
    # tetos e os `jti` — e os `jti` só valem até o `exp` da asserção (~1 min).
    #
    # `noeviction`, e não `volatile-ttl` nem `allkeys-lru`: as duas descartariam
    # justamente o `jti`. O `volatile-ttl` tira primeiro a chave mais perto de
    # vencer, e o `jti` (~70 s) vence antes de qualquer teto (até 1 h); o
    # `allkeys-lru` tira a menos lida, e o `jti` é gravado uma vez e nunca lido.
    # `jti` descartado antes do `exp` é asserção que pode ser repetida. Com
    # `noeviction`, memória cheia vira erro de escrita: o `jti` falha FECHADO
    # (503) e os tetos falham ABERTOS — o mesmo de Redis fora. Toda chave daqui
    # tem prazo (o `jti` até o `exp`, os tetos até a janela deles), então a
    # memória se limpa sozinha; 64 MB é folga larga para isso.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass %s\n' "$$REDISCLI_AUTH" > /tmp/senha.conf &&
        exec redis-server /tmp/senha.conf
        --save ''
        --appendonly no
        --maxmemory 64mb
        --maxmemory-policy noeviction
    healthcheck:
      # Autentica pelo REDISCLI_AUTH: com a senha errada a resposta é NOAUTH ou
      # WRONGPASS, nunca PONG.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  departamentos:
    # Traz os departamentos do Omie para o banco, de hora em hora — é a lista do
    # dropdown do Elite e da APN. Mesmo código do backend, outro comando: um laço,
    # e não um cron do host, para o agendamento subir e descer com a stack e ficar
    # versionado aqui. Ver
    # backend/apps/departamentos/management/commands/sincronizar_departamentos.py.
    #
    # Sem porta e sem a rede do Conecta ID: ele só fala com o banco (pelo túnel)
    # e com o Omie (pela internet). Precisa de OMIE_APP_KEY e OMIE_APP_SECRET no
    # .env; sem elas, cada rodada loga a falha e a lista do banco fica como está.
    build: ./backend
    container_name: lobby-departamentos
    command: ["python", "manage.py", "sincronizar_departamentos", "--a-cada", "3600"]
    env_file: .env
    # O python seria o PID 1, e PID 1 não recebe o tratamento padrão de SIGTERM:
    # sem um init, todo `stop` esperaria os 10 s inteiros e terminaria em SIGKILL.
    init: true
    restart: unless-stopped
    depends_on:
      - db-tunnel
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  categorias:
    # Mesmo laço do `departamentos`, para as categorias financeiras do campo
    # Categoria da APN (TSK-877). Ver
    # backend/apps/categorias_financeiras/management/commands/sincronizar_categorias_financeiras.py.
    #
    # Fala com o Omie (ListarCategorias) pela mesma chave dos departamentos, e só
    # traz as categorias sob CATEGORIAS_FINANCEIRAS_PREFIXOS (padrão 1.10, o grupo
    # "APN"). Ver apps/categorias_financeiras/fonte.py.
    build: ./backend
    container_name: lobby-categorias
    command: ["python", "manage.py", "sincronizar_categorias_financeiras", "--a-cada", "3600"]
    env_file: .env
    init: true
    restart: unless-stopped
    depends_on:
      - db-tunnel
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      # Contexto na raiz: o index.html e o admin.html continuam no lugar de
      # sempre, para o projeto da Cloudflare Pages seguir publicável como
      # rollback durante a transição.
      context: .
      dockerfile: deploy/frontend/Dockerfile
    container_name: lobby-frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      # Exposto só no loopback; o nginx do HOST faz o proxy do subdomínio.
      - "127.0.0.1:8095:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Criada e mantida pela stack do Conecta ID (/opt/identidade/app). Aqui ela é
  # externa: se não existir, o `up` falha alto em vez de criar uma rede vazia com
  # o mesmo nome — que seria pior, porque o serviço subiria sem alcançar ninguém
  # e o erro só apareceria no primeiro login.
  identidade-net:
    external: true
