<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141412">
<!-- Página de credencial: fora de índice de busca, sempre. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Definir senha · Lobby · Conecta AP</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap');

/* Tokens do design system Conecta AP — iguais aos do index.html e admin.html. */
:root{
  --primary:#C7A444; --primary-light:#E8B84B; --primary-dark:#9C7C21;
  --background:#141412; --surface:#1E1E1C; --surface-light:#282826; --surface-elevated:#323230;
  --text:#F0F0F0; --text-secondary:#D0D0D0; --text-muted:#A0A0A0;
  --border-light:rgba(255,255,255,0.1);
  --success:#28A745; --warning:#FFC107; --danger:#DC3545;
  --gradient-primary:linear-gradient(135deg,#C7A444 0%,#9C7C21 100%);
  --font-primary:'Montserrat','Segoe UI',Tahoma,sans-serif;
  --font-secondary:'Roboto','Segoe UI',Tahoma,sans-serif;
  --focus-ring:0 0 0 3px rgba(199,164,68,0.32);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--background);color:var(--text);font-family:var(--font-secondary);-webkit-font-smoothing:antialiased;}
input,button{font-family:'Roboto',sans-serif;}
button{font-family:var(--font-primary);}
@keyframes slideUpFade{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.ms-icon{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;}
.ms-icon.rot{animation:spin .9s linear infinite;}
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:14px;padding:26px;animation:slideUpFade .4s both;}
.inp{width:100%;height:44px;padding:0 12px;border-radius:8px;background:var(--surface-elevated);border:1px solid var(--border-light);color:var(--text);font:400 14px 'Roboto';outline:none;transition:border-color .15s,box-shadow .15s;}
.inp:focus{border-color:var(--primary);box-shadow:var(--focus-ring);}
.lbl{display:block;font:500 12px var(--font-primary);color:var(--text-secondary);margin-bottom:6px;}
.btn-prim{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;padding:0 28px;border-radius:10px;border:none;cursor:pointer;background:var(--gradient-primary);color:#1A1A18;font:700 14px var(--font-primary);letter-spacing:.03em;box-shadow:0 4px 14px rgba(199,164,68,.3);transition:transform .2s,box-shadow .2s,opacity .2s;}
.btn-prim:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(199,164,68,.4);}
.btn-prim:disabled{background:var(--surface-light);color:var(--text-muted);cursor:not-allowed;opacity:.6;box-shadow:none;}
.aviso{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:10px;font:400 13.5px var(--font-secondary);line-height:1.5;}
.aviso.erro{background:rgba(220,53,69,.12);border:1px solid rgba(220,53,69,.32);color:#F1AEB5;}
.aviso.ok{background:rgba(40,167,69,.12);border:1px solid rgba(40,167,69,.32);color:#A3D9AE;}
.tela{min-height:100%;display:grid;place-items:center;padding:24px;}
.dica{font:400 12.5px var(--font-secondary);color:var(--text-muted);line-height:1.55;margin:8px 0 0;}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:6px;display:flex;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
/* ==========================================================================
 * Definir senha — a tela que consome o link do Conecta ID.
 *
 * Página própria, e não uma rota dentro do index.html, pelo mesmo motivo que
 * o /admin é um arquivo à parte: o index.html é o fluxo de venda inteiro, com
 * catálogo, cronograma e Pix. Quem chega aqui só precisa de dois campos, e
 * quase sempre chega sem conseguir entrar em lugar nenhum — carregar o app de
 * vendas para isso seria peso sem função.
 *
 * O token vem na query e identifica a pessoa sozinho: não há `uid`, e é por
 * isso que a tela não pergunta quem você é. Ele é gerado no admin do Conecta
 * ID (ou na tela de usuários do kanban), vale 48 h e serve uma vez só.
 *
 * Nenhuma senha mora neste arquivo nem no banco do Lobby: o backend daqui é um
 * repasse para o Conecta ID, que é quem valida a política e grava o hash.
 * ========================================================================== */
const { useState } = React;

const LOGIN = '/';

function Campo({ rotulo, valor, onChange, autoFocus }) {
  const [ver, setVer] = useState(false);
  return (
    <div style={{ marginBottom: 16 }}>
      <label className="lbl">{rotulo}</label>
      <div style={{ position: 'relative' }}>
        <input
          className="inp"
          type={ver ? 'text' : 'password'}
          value={valor}
          autoFocus={autoFocus}
          autoComplete="new-password"
          onChange={(e) => onChange(e.target.value)}
          style={{ paddingRight: 42 }}
        />
        <button
          type="button"
          className="olho"
          onClick={() => setVer((v) => !v)}
          aria-label={ver ? 'Ocultar senha' : 'Mostrar senha'}
        >
          <span className="ms-icon" style={{ fontSize: 20 }}>{ver ? 'visibility_off' : 'visibility'}</span>
        </button>
      </div>
    </div>
  );
}

function Cartao({ icone, cor, titulo, children }) {
  return (
    <div className="tela">
      <div className="card" style={{ width: '100%', maxWidth: 440 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
          <span className="ms-icon" style={{ color: cor }}>{icone}</span>
          <strong style={{ font: '700 17px var(--font-primary)' }}>{titulo}</strong>
        </div>
        {children}
      </div>
    </div>
  );
}

function App() {
  const token = new URLSearchParams(window.location.search).get('token') || '';

  const [senha, setSenha] = useState('');
  const [confirma, setConfirma] = useState('');
  const [erro, setErro] = useState('');
  const [enviando, setEnviando] = useState(false);
  const [pronto, setPronto] = useState(false);

  // Sem token não há o que fazer aqui, e dizer isso é melhor que mostrar um
  // formulário que vai falhar depois de a pessoa escolher a senha.
  if (!token) {
    return (
      <Cartao icone="link_off" cor="var(--danger)" titulo="Link inválido">
        <div className="aviso erro">
          <span className="ms-icon" style={{ fontSize: 20 }}>error</span>
          <span>Este endereço não traz um link de senha. Peça um novo à diretoria.</span>
        </div>
      </Cartao>
    );
  }

  if (pronto) {
    return (
      <Cartao icone="check_circle" cor="var(--success)" titulo="Senha definida">
        <div className="aviso ok" style={{ marginBottom: 18 }}>
          <span className="ms-icon" style={{ fontSize: 20 }}>lock</span>
          <span>Pronto. Esta senha vale para todos os sistemas da empresa, não só para o Lobby.</span>
        </div>
        <a href={LOGIN} style={{ textDecoration: 'none' }}>
          <button type="button" className="btn-prim">
            <span className="ms-icon" style={{ fontSize: 18 }}>arrow_forward</span>Ir para o Lobby
          </button>
        </a>
      </Cartao>
    );
  }

  const enviar = async (e) => {
    e.preventDefault();
    if (enviando) return;
    setErro('');
    if (!senha) { setErro('Informe a nova senha.'); return; }
    if (senha !== confirma) { setErro('A confirmação não bate com a senha.'); return; }

    setEnviando(true);
    try {
      const r = await fetch('/api/senha/definir', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, senha_nova: senha }),
      });
      const dados = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(dados.erro || 'Não foi possível definir a senha.');
      setPronto(true);
    } catch (err) {
      setErro(err.message);
      setEnviando(false);
    }
  };

  return (
    <Cartao icone="key" cor="var(--primary)" titulo="Defina sua senha">
      <p className="dica" style={{ margin: '0 0 18px' }}>
        Ela vale para todos os sistemas da empresa — Lobby, kanban, CRM e
        Formulários — porque quem guarda a senha é o Conecta ID, e não cada um
        deles. Ninguém mais fica sabendo qual você escolheu.
      </p>

      <form onSubmit={enviar}>
        <Campo rotulo="Nova senha" valor={senha} onChange={setSenha} autoFocus />
        <Campo rotulo="Repita a nova senha" valor={confirma} onChange={setConfirma} />

        {erro && (
          <div className="aviso erro" style={{ marginBottom: 16 }}>
            <span className="ms-icon" style={{ fontSize: 20 }}>error</span>
            <span>{erro}</span>
          </div>
        )}

        <button type="submit" className="btn-prim" disabled={enviando}>
          {enviando
            ? <React.Fragment><span className="ms-icon rot" style={{ fontSize: 18 }}>progress_activity</span>Definindo…</React.Fragment>
            : <React.Fragment><span className="ms-icon" style={{ fontSize: 18 }}>lock</span>Definir senha</React.Fragment>}
        </button>
      </form>

      <p className="dica">
        Pelo menos 10 caracteres. Uma frase curta que só você usa vale mais que
        trocar letra por símbolo. O link expira em 48 horas e serve uma vez só.
      </p>
    </Cartao>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
