<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141412">
<!-- Página de credencial: fora de índice de busca, sempre. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Esqueci minha senha · Lobby · Conecta AP</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap');

/* Tokens do design system Conecta AP — iguais aos do index.html, admin.html e
   definir-senha.html. Copiados, e não importados: as quatro páginas são
   arquivos independentes servidos pelo mesmo nginx, sem build. */
:root{
  --primary:#C7A444; --primary-light:#E8B84B; --primary-dark:#9C7C21;
  --background:#141412; --surface:#1E1E1C; --surface-light:#282826; --surface-elevated:#323230;
  --text:#F0F0F0; --text-secondary:#D0D0D0; --text-muted:#A0A0A0;
  --border-light:rgba(255,255,255,0.1);
  --success:#28A745; --warning:#FFC107; --danger:#DC3545;
  --gradient-primary:linear-gradient(135deg,#C7A444 0%,#9C7C21 100%);
  --font-primary:'Montserrat','Segoe UI',Tahoma,sans-serif;
  --font-secondary:'Roboto','Segoe UI',Tahoma,sans-serif;
  --focus-ring:0 0 0 3px rgba(199,164,68,0.32);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--background);color:var(--text);font-family:var(--font-secondary);-webkit-font-smoothing:antialiased;}
input,button{font-family:'Roboto',sans-serif;}
button{font-family:var(--font-primary);}
@keyframes slideUpFade{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.ms-icon{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;}
.ms-icon.rot{animation:spin .9s linear infinite;}
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:14px;padding:26px;animation:slideUpFade .4s both;}
.inp{width:100%;height:44px;padding:0 12px;border-radius:8px;background:var(--surface-elevated);border:1px solid var(--border-light);color:var(--text);font:400 14px 'Roboto';outline:none;transition:border-color .15s,box-shadow .15s;}
.inp:focus{border-color:var(--primary);box-shadow:var(--focus-ring);}
.lbl{display:block;font:500 12px var(--font-primary);color:var(--text-secondary);margin-bottom:6px;}
.btn-prim{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;padding:0 28px;border-radius:10px;border:none;cursor:pointer;background:var(--gradient-primary);color:#1A1A18;font:700 14px var(--font-primary);letter-spacing:.03em;box-shadow:0 4px 14px rgba(199,164,68,.3);transition:transform .2s,box-shadow .2s,opacity .2s;}
.btn-prim:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(199,164,68,.4);}
.btn-prim:disabled{background:var(--surface-light);color:var(--text-muted);cursor:not-allowed;opacity:.6;box-shadow:none;}
.aviso{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:10px;font:400 13.5px var(--font-secondary);line-height:1.5;}
.aviso.erro{background:rgba(220,53,69,.12);border:1px solid rgba(220,53,69,.32);color:#F1AEB5;}
.aviso.ok{background:rgba(40,167,69,.12);border:1px solid rgba(40,167,69,.32);color:#A3D9AE;}
.tela{min-height:100%;display:grid;place-items:center;padding:24px;}
.dica{font:400 12.5px var(--font-secondary);color:var(--text-muted);line-height:1.55;margin:8px 0 0;}
.voltar{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--text-muted);text-decoration:none;font:400 12.5px var(--font-secondary);}
.voltar:hover{color:var(--text-secondary);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
/* ==========================================================================
 * Esqueci minha senha — a tela que PEDE o link do Conecta ID.
 *
 * A outra metade de `definir-senha.html`: aqui a pessoa pede o link, lá ela
 * usa. Até 28/08/2026 esta metade não existia, e a consequência era concreta:
 * o consultor que esquecia a senha tinha de pedir à diretoria, que gerava o
 * link no kanban — um sistema em que boa parte de quem vende nem entra.
 *
 * A confirmação **não diz se a conta existe**, e o texto assume isso em voz
 * alta ("se houver uma conta"). Esta é a página mais exposta do Lobby depois
 * do login: sem essa uniformidade, um estranho descobre quem trabalha na
 * empresa um palpite por vez. Fingir sucesso também não serviria — soaria
 * mentiroso para quem errou o próprio e-mail.
 *
 * Nenhuma senha passa por aqui: esta tela só manda um endereço, e o link vai
 * para a caixa de quem pediu.
 * ========================================================================== */
const { useState } = React;

const LOGIN = '/';

function Cartao({ icone, cor, titulo, children }) {
  return (
    <div className="tela">
      <div className="card" style={{ width: '100%', maxWidth: 440 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
          <span className="ms-icon" style={{ color: cor }}>{icone}</span>
          <strong style={{ font: '700 17px var(--font-primary)' }}>{titulo}</strong>
        </div>
        {children}
      </div>
    </div>
  );
}

function App() {
  const [email, setEmail] = useState('');
  const [erro, setErro] = useState('');
  const [enviando, setEnviando] = useState(false);
  const [pedido, setPedido] = useState(false);

  const enviar = async (e) => {
    e.preventDefault();
    if (enviando) return;
    setErro('');
    if (!email) { setErro('Informe o seu e-mail.'); return; }

    setEnviando(true);
    try {
      const r = await fetch('/api/senha/esqueci', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const dados = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(dados.erro || 'Não foi possível pedir o link agora.');
      setPedido(true);
    } catch (err) {
      // Só chega aqui o que não é sobre a conta: Conecta ID fora do ar ou
      // campo vazio. E-mail desconhecido responde sucesso, de propósito.
      setErro(err.message);
    } finally {
      setEnviando(false);
    }
  };

  return (
    <Cartao icone="mail" cor="var(--primary)" titulo="Esqueci minha senha">
      <p className="dica" style={{ margin: '0 0 18px' }}>
        Informe o e-mail da sua conta e enviamos o link para você definir uma
        senha nova. Ela vale para todos os sistemas da empresa — Lobby, kanban,
        CRM e Formulários.
      </p>

      {pedido && (
        <div className="aviso ok" style={{ marginBottom: 16 }}>
          <span className="ms-icon" style={{ fontSize: 20 }}>mark_email_read</span>
          <span>
            Se houver uma conta com esse e-mail, o link acabou de ser enviado.
            Ele vale 48 horas e serve uma vez só. Não chegou? Veja o lixo
            eletrônico ou peça de novo.
          </span>
        </div>
      )}

      <form onSubmit={enviar}>
        <div style={{ marginBottom: 16 }}>
          <label className="lbl" htmlFor="email">E-mail da sua conta</label>
          <input
            id="email"
            className="inp"
            type="email"
            value={email}
            autoFocus
            autoComplete="username"
            onChange={(e) => setEmail(e.target.value)}
          />
        </div>

        {erro && (
          <div className="aviso erro" style={{ marginBottom: 16 }}>
            <span className="ms-icon" style={{ fontSize: 20 }}>error</span>
            <span>{erro}</span>
          </div>
        )}

        <button type="submit" className="btn-prim" disabled={enviando}>
          {enviando
            ? <React.Fragment><span className="ms-icon rot" style={{ fontSize: 18 }}>progress_activity</span>Enviando…</React.Fragment>
            : <React.Fragment><span className="ms-icon" style={{ fontSize: 18 }}>send</span>{pedido ? 'Enviar de novo' : 'Enviar o link'}</React.Fragment>}
        </button>
      </form>

      <a className="voltar" href={LOGIN}>
        <span className="ms-icon" style={{ fontSize: 16 }}>arrow_back</span>Voltar para o Lobby
      </a>
    </Cartao>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
